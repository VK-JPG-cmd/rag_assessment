services:
  - type: web
    name: patient-record-rag
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false
